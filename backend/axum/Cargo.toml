[package]
name = "nas-sync-manager-axum"
version = "0.9.1"
edition = "2021"
autotests = false

[dependencies]
nas-app-core = { git = "https://github.com/ValerioGc/nas-app-core", tag = "v0.1.0" }
axum = "0.8.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9", default-features = false, features = ["sqlite", "runtime-tokio", "migrate", "macros"] }
tokio = { version = "1.54.1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
